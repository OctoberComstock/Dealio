<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aleo:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --font-body:       'DM Sans', system-ui, sans-serif;
            --font-display:    'Aleo', Georgia, serif;

            --bg:              #F8F4EF;
            --surface:         #FFFDF9;
            --surface-raised:  #FFFFFF;
            --border:          #E7DED5;
            --border-light:    #F0E9E2;

            --text-primary:    #534236;
            --text-secondary:  #7B6D62;
            --text-muted:      #A8A09A;

            --accent:          #5E7B65;
            --accent-hover:    #4A6450;

            --good-deal-text:   #36604A;
            --good-deal-bg:     #E6F2EB;
            --good-deal-border: #B8D9C2;

            --fair-text:        #8A6030;
            --fair-bg:          #FBF3E8;
            --fair-border:      #DDB97A;

            --overpriced-text:   #7A3535;
            --overpriced-bg:     #F5EAEA;
            --overpriced-border: #CFA8A8;

            --scale-low:     #8FA384;
            --scale-mid:     #D8B978;
            --scale-high:    #C88F91;

            --error-text:  #7A3535;
            --error-bg:    #F5ECEC;
            --error-border: #CFAAAA;

            --radius-sm:   8px;
            --radius-md:   14px;
            --radius-lg:   22px;
            --radius-pill: 100px;

            --shadow-sm: 0 2px 8px rgba(50, 30, 10, 0.06), 0 1px 2px rgba(50, 30, 10, 0.04);
            --shadow-md: 0 18px 42px rgba(50, 30, 10, 0.08), 0 2px 8px rgba(50, 30, 10, 0.05);
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text-primary);
            margin: 0;
            padding: 2rem 1rem;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
