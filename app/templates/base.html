<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --bg:              #F7F3EE;
            --surface:         #FDFAF6;
            --surface-raised:  #FFFFFF;
            --border:          #E4DDD4;
            --border-light:    #EDE8E2;

            --text-primary:    #241A11;
            --text-secondary:  #756B62;
            --text-muted:      #A8A09A;

            --accent:          #5E7B65;
            --accent-hover:    #4A6450;

            --good-deal-text:   #36604A;
            --good-deal-bg:     #E6F2EB;
            --good-deal-border: #B8D9C2;

            --fair-text:        #8A6030;
            --fair-bg:          #FBF3E8;
            --fair-border:      #DDB97A;

            --overpriced-text:   #7A3535;
            --overpriced-bg:     #F5EAEA;
            --overpriced-border: #CFA8A8;

            --error-text:  #7A3535;
            --error-bg:    #F5ECEC;
            --error-border: #CFAAAA;

            --radius-sm:   8px;
            --radius-md:   14px;
            --radius-lg:   22px;
            --radius-pill: 100px;

            --shadow-sm: 0 1px 3px rgba(50, 30, 10, 0.07), 0 1px 2px rgba(50, 30, 10, 0.04);
            --shadow-md: 0 4px 16px rgba(50, 30, 10, 0.09), 0 2px 4px rgba(50, 30, 10, 0.04);
        }

        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            margin: 0;
            padding: 2rem 1rem;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
