{% extends "base.html" %}
{% block content %}
<main>
    <h1>Dealio</h1>
    <p class="tagline">Paste a product URL to find out if it's a good deal.</p>

    {% if received %}
    <div class="confirmation">
        <strong>URL received:</strong><br>
        <code>{{ submitted_url }}</code>
    </div>
    {% else %}
    <form class="url-form" method="post" action="/">
        <input
            class="url-input"
            type="url"
            name="product_url"
            value="{{ submitted_url or '' }}"
            placeholder="https://www.amazon.com/dp/..."
            autocomplete="off"
            autofocus
        >
        <button class="submit-button" type="submit">Check deal</button>
    </form>
    {% if error %}
    <p class="error-message">{{ error }}</p>
    {% endif %}
    {% endif %}
</main>
{% endblock %}
